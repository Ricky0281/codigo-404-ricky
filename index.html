<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Código 404: Comunicación no encontrada</title>
<style>
:root{--navy:#081c35;--orange:#ff9b45;--cyan:#62e1d5}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.bar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#061426;font:700 12px monospace;letter-spacing:.08em}.bar b{color:var(--cyan);font-size:17px}.bar button{background:transparent;border:1px solid #557290;color:#fff;border-radius:20px;padding:9px 14px;font:700 11px monospace;cursor:pointer}.bar button.on{background:var(--cyan);color:var(--navy)}.viewer{position:relative;flex:1;display:grid;place-items:center;padding:18px}#slides{position:absolute;inset:18px;display:flex;align-items:center;justify-content:center}.slide{max-width:1400px;width:100%;height:100%;display:none;align-items:center;justify-content:center}.slide.active{display:flex;animation:in .55s ease}.slide img{width:min(100%,1300px);height:auto;max-height:100%;object-fit:contain;border:5px solid #0a0f18;box-shadow:0 18px 50px #0008}@keyframes in{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}.cover{position:absolute;inset:18px;display:none;place-items:center;text-align:center;background:linear-gradient(135deg,#103b69,#081c35 60%,#102a48);border:3px solid #2d6b8b}.cover.active{display:grid}.cover h1{font-size:clamp(44px,8vw,112px);line-height:.88;margin:0;letter-spacing:-.06em}.cover h1 span{color:var(--orange)}.cover p{font-size:clamp(16px,2vw,25px);color:#cde1f6;max-width:700px;margin:24px auto}.ricky{font-size:14px;letter-spacing:.1em;color:var(--cyan);font-weight:700}.dots{height:76px;background:#fff;display:flex;align-items:center;justify-content:center;gap:13px}.dot{width:10px;height:10px;border:0;border-radius:50%;background:#c8d1dc;cursor:pointer}.dot.active{background:var(--orange);transform:scale(1.35)}.nav{position:absolute;left:22px;right:22px;bottom:94px;display:flex;justify-content:space-between;pointer-events:none}.nav button{pointer-events:auto;border:0;border-radius:12px;background:#fff;color:var(--navy);padding:13px 17px;font-weight:700;cursor:pointer}.nav button:disabled{opacity:.35}@media(max-width:700px){.bar{padding:0 13px}.bar span{display:none}.viewer{padding:8px}.nav{bottom:85px;left:8px;right:8px}}
</style></head>
<body><div class="app"><header class="bar"><div><b>&lt;/&gt;</b> CÓMIC ANIMADO · RICKY</div><div><span id="counter">PORTADA</span> <button id="voice">◉ VOZ</button></div></header><main class="viewer"><section class="cover active"><div><div class="ricky">COMUNICACIÓN Y LENGUAJE · INGENIERÍA DE SISTEMAS</div><h1>Código <span>404</span><br>Comunicación<br>no encontrada</h1><p>Una historia de Ricky y su equipo sobre mensajes ambiguos, gestos y rumores que crecen.</p><div class="ricky">PRESENTACIÓN LISTA PARA EXPONER</div></div></section><div id="slides"></div><div class="nav"><button id="prev">← Anterior</button><button id="next">Siguiente →</button></div></main><footer class="dots" id="dots"></footer></div>
<script>
const data=[['scene-01.png','El mensaje ambiguo'],['scene-02.png','Las interpretaciones'],['scene-03.png','Lo que no vemos'],['scene-04.png','Lenguaje no verbal'],['scene-05.png','El rumor crece'],['scene-06.png','Caos total'],['scene-07.png','La aclaración'],['scene-08.png','La lección']];const narration=['Ricky envía al grupo el mensaje: revisen eso urgente.','Cada compañero interpreta algo diferente.','Ricky está preocupado por un error pequeño.','La cara, la postura y el silencio también comunican.','El rumor crece porque nadie verifica.','El equipo entra en pánico aunque el problema es pequeño.','Ricky aclara el contexto y el equipo recupera la calma.','En sistemas un error de código se corrige, pero un error de comunicación puede multiplicarse.'];const host=document.getElementById('slides'),dots=document.getElementById('dots'),cover=document.querySelector('.cover');let current=0,voiceOn=false;data.forEach((s,i)=>{const el=document.createElement('section');el.className='slide';el.innerHTML='<img src="assets/'+s[0]+'" alt="'+s[1]+'">';host.appendChild(el);const d=document.createElement('button');d.className='dot';d.title=s[1];d.onclick=()=>go(i+1);dots.appendChild(d)});const slides=[...document.querySelectorAll('.slide')],dotEls=[...document.querySelectorAll('.dot')];function go(n){current=Math.max(0,Math.min(8,n));cover.classList.toggle('active',current===0);slides.forEach((e,i)=>e.classList.toggle('active',i===current-1));dotEls.forEach((d,i)=>d.classList.toggle('active',i===current-1));document.getElementById('counter').textContent=current===0?'PORTADA':'ESCENA '+String(current).padStart(2,'0')+' / 08';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===8;if(voiceOn&&current>0)speak()}function speak(){if(!('speechSynthesis'in window)||current===0)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(narration[current-1]);u.lang='es-CO';u.rate=.95;speechSynthesis.speak(u)}document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('voice').onclick=()=>{voiceOn=!voiceOn;document.getElementById('voice').classList.toggle('on',voiceOn);if(voiceOn)speak();else speechSynthesis?.cancel()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});go(0);
</script></body></html>
